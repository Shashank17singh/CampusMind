[project]
name = "campusmind-backend"
version = "0.1.0"
description = "CampusMind API, ingestion pipeline and agents"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.0",
    "argon2-cffi>=23.1",
    "celery>=5.4",
    "chromadb>=0.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=1.2.19",
    "pdfplumber>=0.11",
    "pillow>=10.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0",
    "qdrant-client>=1.11",
    "rank-bm25>=0.2.2",
    "redis>=5.0",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0.30",
    "structlog>=24.4",
    "tiktoken>=0.7",
    "torch>=2.3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "fakeredis>=2.23",
    "mypy>=1.11",
    "pgserver>=0.1.4",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

# CPU build by default, because the CUDA one is several GB. Machines with a GPU can
# remove this source to get CUDA wheels.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
faulthandler_timeout = 120
markers = [
    "model: loads a real ML model (slow, needs a download)",
    "ocr: needs the Tesseract binary",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

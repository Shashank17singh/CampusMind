name: Weekly Lucknow University Document Sync

on:
  schedule:
    # Run every Monday at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * 1'
  workflow_dispatch:
    # Allows manual trigger on-demand from the GitHub Actions tab

jobs:
  sync:
    name: Sync Official UoL Documents
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run Weekly UoL Scraper & Vector Sync
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BACKEND_URL: https://shashank17singh-campusmind.hf.space
          EMBEDDING_DEVICE: cpu
          LLM_PROVIDER: groq
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENVIRONMENT: production
          CELERY_EAGER: "True"
        run: |
          uv run python ../scripts/sync_uol_weekly.py

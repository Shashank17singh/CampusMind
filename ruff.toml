line-length = 100
target-version = "py311"
extend-exclude = ["backend/alembic/versions", "frontend"]

[lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "E501"]

[lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

[lint.per-file-ignores]
"backend/tests/*" = ["S105", "S106", "S311"]
"eval/*" = ["S105", "S106", "S311"]
